version: 2
updates:
  # Bump pinned action versions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"


  # No "gitsubmodule" entry on purpose. It tracks each submodule's default-branch HEAD, so it kept proposing
  # non-stable OpenZeppelin commits that could not be merged as-is (closed 8 times, e.g. #110 needed
  # solc ^0.8.31 while we pin 0.8.28). Submodules (forge-std, OpenZeppelin) are bumped by hand to a stable
  # tag; see "Dependency-bump policy" in AGENTS.md. Dependabot alerts stay on for the repo.
