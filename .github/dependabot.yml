version: 2
updates:
  # Bump pinned action versions in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Bump the lib/ dependency submodules (forge-std, OpenZeppelin) pinned in foundry.lock.
  #
  # NOTE: the gitsubmodule ecosystem tracks each submodule's default-branch HEAD, so Dependabot can
  # propose non-stable commits (RCs / master). For a contracts repo, treat these PRs as a "something
  # is newer" signal and re-pin to the latest STABLE tag rather than merging the proposed commit
  # verbatim, and freeze deps during an audit. The storage-layout guard + the state-preserving
  # upgrade test are the safety net that turns an OZ bump into an evidenced decision. See AGENTS.md.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # openzeppelin-contracts and openzeppelin-contracts-upgradeable are released in lockstep and
    # must always move together to the same version — group them into one PR so they never bump apart.
    groups:
      openzeppelin:
        patterns:
          - "*openzeppelin*"
