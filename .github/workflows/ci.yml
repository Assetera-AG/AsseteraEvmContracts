name: ci

# Required PR gate for AsseteraEvmContracts (ADR-0004 engineering workflow / ADR-0013 github-config-as-code).
# The `build` job is the required status check wired into the protect-main ruleset, codified in
# AsseteraInfrastructure/github/repo-baseline.tf. Keep the job name in sync with that ruleset's context.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts # the Foundry project lives here (monorepo; SDK is in packages/sdk)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # deps are pinned git submodules under contracts/lib/

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format check
        run: forge fmt --check

      - name: Solhint
        run: npx --yes solhint@5.2.0 'src/**/*.sol' 'script/**/*.sol' 'test/**/*.sol'

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci # heavier fuzzing (see foundry.toml [profile.ci])

  sdk:
    # Build the generated TypeScript SDK (@asseteragmbh/evm-contracts). Needs Foundry because codegen runs
    # `forge build` (wagmi/cli foundry plugin) to produce the ABIs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # the SDK codegen reads the contracts' build output

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Generate (ABIs + deployments)
        run: npm run generate -w @asseteragmbh/evm-contracts
      - name: Typecheck
        run: npm run typecheck -w @asseteragmbh/evm-contracts
      - name: Build
        run: npm run build -w @asseteragmbh/evm-contracts
      - name: Build the Next.js example (proves the consumer story compiles against the package)
        run: npm run build -w evm-contracts-example-nextjs
