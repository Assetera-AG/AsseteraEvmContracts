[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# Deploy scripts write the per-network deployment artifact into the SDK (its source of truth, ADR-0026 D4).
fs_permissions = [{ access = "read-write", path = "../packages/sdk/src/deployments" }]

# Deterministic-ish bytecode (nice for diffing deployments)
bytecode_hash = "none"

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "createx-forge/=lib/createx-forge/",
]

[profile.ci]
fuzz = { runs = 5000 }
verbosity = 3

[fuzz]
runs = 256

[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
amoy = "${AMOY_RPC_URL}"
